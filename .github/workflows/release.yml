# Attaches prebuilt binaries and SHA256SUMS to a GitHub release.
#
# Runs when a release is published (`gh release create vX.Y.Z --verify-tag`).
# Run it by hand with a tag to (re)build the assets of an existing release.
# scripts/install.sh and scripts/install.ps1 download these; every asset must
# be present, or the run fails so a broken release is noticed.
name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.7
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            runs: true
            suffix: ''
          - target: x86_64-apple-darwin
            os: macos-14
            runs: false
            suffix: ''
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            runs: true
            suffix: ''
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            runs: true
            suffix: ''
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            runs: true
            suffix: '.exe'
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag matches the manifest and Cargo.toml
        run: |
          version="${TAG#v}"
          grep -qx "version = \"$version\"" herdr-plugin.toml || { echo "::error::herdr-plugin.toml version is not $version"; exit 1; }
          grep -qx "version = \"$version\"" Cargo.toml || { echo "::error::Cargo.toml version is not $version"; exit 1; }

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
          rustup default stable

      - name: Check formatting
        if: matrix.runs
        run: cargo fmt --all -- --check

      - name: Check native targets without warnings
        if: matrix.runs
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Test the native release source
        if: matrix.runs
        run: cargo test --locked --all-targets --target ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Name the binary
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/herdr-projects${{ matrix.suffix }} dist/herdr-projects-${{ matrix.target }}${{ matrix.suffix }}

      - name: Check it runs and reports the release version
        if: matrix.runs
        run: |
          out=$(dist/herdr-projects-${{ matrix.target }}${{ matrix.suffix }} --version)
          echo "$out"
          case "$out" in
            "herdr-projects ${TAG#v}" | "herdr-projects ${TAG#v}+"*) ;;
            *) echo "::error::expected herdr-projects ${TAG#v}"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: herdr-projects-${{ matrix.target }}
          path: dist/herdr-projects-${{ matrix.target }}${{ matrix.suffix }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ASSETS: >-
        herdr-projects-aarch64-apple-darwin
        herdr-projects-x86_64-apple-darwin
        herdr-projects-aarch64-unknown-linux-musl
        herdr-projects-x86_64-unknown-linux-musl
        herdr-projects-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check every binary is there and write SHA256SUMS
        working-directory: dist
        run: |
          for asset in $ASSETS; do
            [ -s "$asset" ] || { echo "::error::$asset is missing"; exit 1; }
          done
          # shellcheck disable=SC2086 # $ASSETS is a word list
          sha256sum $ASSETS > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to the release
        working-directory: dist
        run: |
          # shellcheck disable=SC2086 # $ASSETS is a word list
          gh release upload "$TAG" $ASSETS SHA256SUMS --clobber

      - name: Check the release carries every asset
        run: |
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for asset in $ASSETS SHA256SUMS; do
            printf '%s\n' "$names" | grep -qx "$asset" || { echo "::error::release $TAG has no $asset"; exit 1; }
          done
          echo "release $TAG carries all binaries and SHA256SUMS"

  install-smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the published binary and exercise the CLI
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import tempfile

          with tempfile.TemporaryDirectory(prefix='release-install-', dir=os.environ['RUNNER_TEMP']) as temporary:
              home = pathlib.Path(temporary, 'home')
              home.mkdir()
              environment = dict(os.environ, HOME=str(home), USERPROFILE=str(home),
                                 HERDR_HOME=str(home / '.herdr'), HERDR_BIN_DIR=str(home / 'bin'),
                                 XDG_CONFIG_HOME=str(home / '.config'), XDG_DATA_HOME=str(home / '.local' / 'share'),
                                 XDG_STATE_HOME=str(home / '.local' / 'state'), XDG_CACHE_HOME=str(home / '.cache'))
              for key in ('GH_TOKEN', 'GITHUB_TOKEN', 'HERDR_PROJECTS_BUILD', 'HERDR_PROJECTS_DOWNLOAD_URL'):
                  environment.pop(key, None)
              windows = os.name == 'nt'
              command = (['powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'scripts/install.ps1']
                         if windows else ['sh', 'scripts/install.sh'])
              installed = subprocess.run(command, env=environment, capture_output=True, text=True, check=True)
              print(installed.stdout, end='')
              print(installed.stderr, end='')
              if 'building from source instead' in installed.stderr:
                  raise RuntimeError('release installation used Cargo instead of the published binary')
              binary = pathlib.Path('target/release', 'herdr-projects.exe' if windows else 'herdr-projects').resolve()
              root = pathlib.Path(temporary, "project root O'Brien 世界")

              def cli(*args):
                  result = subprocess.run([str(binary), *args], env=environment, capture_output=True,
                                          text=True, encoding='utf-8', check=True)
                  print(result.stdout, end='')
                  print(result.stderr, end='')
                  return result.stdout

              version = os.environ['TAG'].removeprefix('v')
              reported = cli('--version').strip()
              if reported != f'herdr-projects {version}' and not reported.startswith(f'herdr-projects {version}+'):
                  raise RuntimeError(f'wrong installed release version: {reported}')
              cli('--root', str(root), 'new', 'release-smoke', '--goal', 'Published release installation smoke')
              if not pathlib.Path(root, 'release-smoke', 'PROJECT.md').is_file():
                  raise RuntimeError('installed release did not create the project')
              listing = cli('--root', str(root), 'list')
              if not any(line.split('\t', 1)[0] == 'release-smoke' for line in listing.splitlines()):
                  raise RuntimeError('installed release did not list its project')
              context = cli('--root', str(root), 'context', 'release-smoke', '--peek')
              if 'Published release installation smoke' not in context:
                  raise RuntimeError('installed release did not load the project goal')
          PY
